<html>
<head>
	<title></title>
</head>
<body>
<p>﻿</p>

<div class="container main-body">
<section class="content-container" id="main">
<h1>Day League Baseball Registration List <img ng-show="loadingData" src="img/loading1.gif" title="Loading" /></h1>

<table class="table">
	<thead>
		<tr>
			<th>Order</th>
			<th>Name</th>
			<th>Age</th>
			<th>Team</th>
			<th>Registered</th>
			<th>Balance</th>
			<th>Waiver</th>
		</tr>
	</thead>
	<tbody>
		<tr ng-repeat="player in dayPlayers.players">
			<td>{{$index + 1}}</td>
			<td><a href="#!/player/{{player.playerId}}">{{player.firstName}} {{player.lastName}}</a></td>
			<td>{{getPlayerAge(player.birthDate)}}</td>
			<td>{{player.team}}</td>
			<td>{{player.registered}}</td>
			<td>{{.01 * player.balance | currency}}</td>
			<td><span class="label" ng-class="isTrue(player.waiver) ? 'success fa fa-check' : 'danger fa fa-times'">{{isTrue(player.waiver) ? &#39;Yes&#39; : &#39;No&#39;}}</span></td>
		</tr>
	</tbody>
</table>
</section>
</div>
</body>
</html>
